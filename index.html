<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <div class = "main">
    <h1>Guess The Number</h1>
        <div class = "guessInfo">
                <p class="para">Try and guess a random number between 1 and 100</p>
                <p class = "para">You have 10 attempts to guess the right number. </p>
                <label id = "heading">Guess a number</label><br>
                <input class="input" type="number"><br>
                <button class = "btn">Submit Guess</button><br>
                <p class = "lostMsg"></p>
                <p class = "previousInfo"></p>
                <p class = "remaining"></p>
                <h3 class = "result"></h3>
                <button class = "again">Play Again.</button>

        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
